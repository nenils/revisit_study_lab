services:
  study:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_STORAGE_ENGINE: ${VITE_STORAGE_ENGINE:-localStorage}
        VITE_REPO_URL: ${VITE_REPO_URL:-https://github.com/revisit-studies/study}
        VITE_FIREBASE_CONFIG: ${VITE_FIREBASE_CONFIG:-}
        VITE_RECAPTCHAV3TOKEN: ${VITE_RECAPTCHAV3TOKEN:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_LSL_ENABLED: ${VITE_LSL_ENABLED:-false}
        VITE_LSL_WS_URL: ${VITE_LSL_WS_URL:-ws://127.0.0.1:8765}
    ports:
       - "0.0.0.0:${STUDY_HTTP_PORT:-8081}:80"
       - "0.0.0.0:${STUDY_HTTPS_PORT:-4430}:443"
    depends_on:
      - haic-api
    restart: unless-stopped

  haic-api:
    build:
      context: ./services/haic_api
    env_file:
      .env.docker
    restart: unless-stopped

  lsl-bridge:
    profiles:
      - lsl-docker
    build:
      context: ./services/lsl_bridge
    environment:
      LSL_STREAM_NAME: ${LSL_STREAM_NAME:-reVISit Markers}
      LSL_STREAM_TYPE: ${LSL_STREAM_TYPE:-Markers}
      LSL_SOURCE_ID: ${LSL_SOURCE_ID:-revisit-lsl-marker-stream}
    ports:
      - "127.0.0.1:${LSL_BRIDGE_PORT:-8765}:8765"
    restart: unless-stopped
